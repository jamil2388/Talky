services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talky-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/audio:/app/audio
      - ./backend/voices:/app/voices
      - ./backend/llm_models:/app/llm_models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talky-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
